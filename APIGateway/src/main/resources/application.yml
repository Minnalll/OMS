server:
  port: 8080

spring:
  application:
    name: APIGateway


  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

#          routes:
#            - id: product-service
#              uri: lb://PRODUCTSERVICE
#              predicates:
#                - Path=/products/**
#
#            - id: order-service
#              uri: lb://ORDERSERVICE
#              predicates:
#                - Path=/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

auth:
  service:
    url: http://AUTHSERVICE

management:
  endpoints:
    web:
      exposure:
        include: "*"

gateway:
  security:
    api-key: oms-secret-key-2026